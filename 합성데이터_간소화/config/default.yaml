# 조선소 밀폐구역 5가스 합성 시계열(간소화) 설정
# 물리 모델 없이 작업 종류·상황별 시간 패턴(완만한 상승 → 유지 → 점진 감소)으로 곡선을 만든다.
# 모든 행은 source_type=SYNTHETIC. 상황 비율은 학습·기능 검증용 균형 세트이며 실제 발생 빈도가 아니다.

random_seed: 20261031
source_type: SYNTHETIC

time:
  sample_interval_s: 15          # 저장 간격(초)
  prediction_horizon_min: 60     # minutes_to_threshold 예측 범위(분)
  pre_work_min: [5, 15]          # 작업 전 구간
  work_min: [20, 85]             # 작업 구간
  recovery_min: [5, 25]          # 작업 종료 후 구간
  total_max_min: 120             # 에피소드 총 길이 상한(30~120분)
  none_episode_min: [30, 60]     # NONE(작업 없음) 에피소드 길이
  base_datetime: "2026-11-02T06:00:00"
  episode_spacing_h: 3

thresholds:                      # 산업안전보건기준에 관한 규칙 적정공기 + LEL 10% 작업 기준
  o2_low_pct: 18.0
  o2_high_pct: 23.5
  co_ppm: 30.0
  h2s_ppm: 10.0
  co2_pct: 1.5
  lel_pct: 10.0
approach_band:                   # 경계 접근 범위(기준까지의 거리)
  o2_pct: 0.5
  co_ppm: 6.0
  h2s_ppm: 2.0
  co2_pct: 0.3
  lel_pct: 2.0

background:                      # 정상 배경값 범위
  o2_pct: [20.8, 20.95]
  lel_pct: [0.0, 1.0]
  co_ppm: [0.0, 2.0]
  h2s_ppm: [0.0, 0.3]
  co2_pct: [0.04, 0.08]
noise_sd:                        # 측정 잡음(정상 상태에서도 존재)
  o2_pct: 0.04
  lel_pct: 0.3
  co_ppm: 0.6
  h2s_ppm: 0.1
  co2_pct: 0.01
resolution:                      # 표시 해상도(반올림)
  o2_pct: 0.1
  lel_pct: 1.0
  co_ppm: 1.0
  h2s_ppm: 0.1
  co2_pct: 0.01

# 경계 접근(APPROACH) 정점 범위: 잡음·반올림으로 기준을 넘지 않도록 기준에서 여유를 둔다
approach_peak:
  o2_low: [18.15, 18.45]
  o2_high: [23.05, 23.35]
  co: [24.5, 28.5]
  h2s: [8.2, 9.4]
  co2: [1.22, 1.46]
  lel: [8.2, 9.1]
# 기준 초과(EXCEED) 정점 범위
exceed_peak:
  o2_low: [15.5, 17.6]
  o2_high: [23.8, 25.0]
  co: [34, 120]
  h2s: [11, 40]
  co2: [1.6, 3.5]
  lel: [12, 40]
o2_high_fraction: 0.15           # O2 이상 중 산소 과잉(≥23.5%) 비율
# 완만한 변화(MILD): 경계 접근 범위까지 거리의 비율
mild_fraction_of_gap: [0.15, 0.5]

curve:                           # 곡선 시간 상수(분)
  onset_after_start_min: [2, 25]
  rise_tau_min: [3, 20]
  hold_min: [5, 30]
  decay_tau_min: [5, 25]
  recover_in_work_hold_min: [3, 12]
  secondary_drift_prob: 0.5      # 위험 에피소드에서 다른 가스 1~2개가 함께 완만히 변할 확률

# 작업 종류별 위험 가스 가중치(약한 관계). 가스 종류별 상황을 배정할 때 작업을 뽑는 가중치로만 쓴다.
task_types: [HOT_WORK, PAINTING_CLEANING, ELECTRICAL, RADIOGRAPHY, COMMISSIONING, SCAFFOLDING, FLUID_SUPPLY, PRESSURE_TEST, BARGE_WORK, HEAVY_LIFTING, OTHER, NONE]
task_gas_weight:
  HOT_WORK:          {CO: 5.0, O2: 1.5, CO2: 1.5, LEL: 1.0, H2S: 0.5}
  PAINTING_CLEANING: {LEL: 5.0, CO2: 1.0, O2: 1.5, CO: 0.8, H2S: 0.7}
  FLUID_SUPPLY:      {O2: 3.0, CO2: 2.5, H2S: 2.5, CO: 0.8, LEL: 1.0}
  COMMISSIONING:     {O2: 3.0, CO2: 2.5, H2S: 2.0, CO: 1.0, LEL: 1.0}
  ELECTRICAL:        {O2: 1.0, CO2: 1.0, H2S: 0.5, CO: 0.7, LEL: 0.5}
  RADIOGRAPHY:       {O2: 1.0, CO2: 1.0, H2S: 0.5, CO: 0.5, LEL: 0.5}
  SCAFFOLDING:       {O2: 1.0, CO2: 1.0, H2S: 0.5, CO: 0.7, LEL: 0.5}
  PRESSURE_TEST:     {O2: 1.2, CO2: 1.0, H2S: 0.5, CO: 0.5, LEL: 0.5}
  BARGE_WORK:        {O2: 1.0, CO2: 1.0, H2S: 1.0, CO: 0.7, LEL: 0.7}
  HEAVY_LIFTING:     {O2: 1.0, CO2: 1.0, H2S: 0.5, CO: 0.5, LEL: 0.5}
  OTHER:             {O2: 1.0, CO2: 1.0, H2S: 1.0, CO: 1.0, LEL: 1.0}
  # NONE: 위험 상황 배정 안 함(정상 배경·센서 점검만)

# 에피소드 구성(개수). 실제 빈도가 아니라 학습·검증용 균형 세트
episodes:
  normal_per_task: 22            # 모든 작업 종류(NONE 포함)에 정상 에피소드
  mild_change: 60                # 작업 시작 후 완만한 변화(정상 유지)
  approach_per_gas: 62           # 가스별 경계 접근
  exceed_per_gas: 60             # 가스별 기준 초과(초과 후 유지, 이후 점진 감소)
  recovery_in_work: 50           # 위험 상태에서 작업 중 정상으로 회복
  recovery_after_work: 50        # 작업 종료 후 회복
  sensor_short_missing: 50       # 센서 단기 결측(정상/위험 바탕에 중첩)
  sensor_comm_loss: 50           # 장시간 통신 두절
  sensor_error: 50               # 일시적 이상값
  missing_before_danger: 50      # 위험 직전 결측(초과 에피소드에 중첩)
  min_per_task: 50               # 작업 종류별 최소 수(부족하면 정상 에피소드로 보충)
  sensor_overlay_on_danger_prob: 0.5   # 센서 이상 에피소드의 바탕이 위험 상황일 확률
  split: {train: 0.70, validation: 0.15, test: 0.15}

sensor_faults:
  short_missing: {count: [1, 3], samples: [1, 3]}
  comm_loss_min: [5, 30]
  sensor_error: {count: [1, 2], samples: [1, 2]}
  sensor_error_magnitude:        # 이상값 크기(가스별, ± 무작위)
    o2_pct: [0.8, 3.0]
    lel_pct: [5, 30]
    co_ppm: [15, 80]
    h2s_ppm: [3, 15]
    co2_pct: [0.3, 1.2]
  missing_before_danger: {lead_min: [1, 6], duration_min: [3, 15]}

output:
  dir: output
  sample_rows: 20000
